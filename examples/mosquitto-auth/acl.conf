# LEGACY: the file-based Volley broker ACL (mosquitto `acl_file`) of earlier Volley versions,
# kept for reference while migrating (`volley auth migrate`). Volley now requires mosquitto >= 2.1
# with the Dynamic Security plugin and its shared roles (roles.json); the broker no longer reads
# this file. See README.md in this directory.
#
# Every client authenticates (allow_anonymous false). Usernames are either one
# of the three fixed identities below, or an agent id minted by
# `volley auth add-agent <agent_id>` (the username IS the agent id, which is
# what `%u` substitutes below).
#
# mosquitto semantics worth knowing before editing this file:
#   - `pattern` lines apply to EVERY authenticated user, fixed identities included.
#     mosquitto logs "ACL pattern ... does not contain '%c' or '%u'" for the two
#     global grants below; that is expected (they are meant for everyone).
#   - `topic` lines apply only to the `user` section they appear under.
#   - A `deny` overrides every grant, the user's own and the patterns. A one-time
#     token login's block (`volley auth token`) denies `volley/#`, so it reaches
#     only its own topics under `volley-auth/`, which no pattern here covers.
#   - Access is the union of every matching allow line.
#   - Do not use `deny` to carve out `_waves/*`: in mosquitto a deny also blocks
#     READS, so the Desk and coordinators would stop seeing wave state. The
#     grants below enumerate channels instead.
#   - CAVEAT: the namespace `+` also matches the reserved `_waves`, `_system`
#     and `_meta` levels, and mosquitto cannot exclude them. So
#     `volley/+/%u/status` matches `volley/_waves/<agent id>/status`, and
#     `volley/+/+/mailbox` matches `volley/_system/registry/mailbox`. The
#     reserved prefixes are protected only because no topic SPEC §4.6 defines
#     there ends in a channel name (wave ids and lease-pool names MUST NOT be
#     channel names), and `volley auth add-agent` refuses ids such as
#     `registry`, `leases` and the channel names. For a hard guarantee, generate
#     this file per namespace (`volley/<ns>/%u/status`) instead of using `+`.
#   - A denied PUBLISH is dropped silently (the publisher still gets its PUBACK
#     under MQTT 3.1.1). Verify a change with a subscriber, not by publish errors.
#   - Edits take effect on a broker reload (SIGHUP): `volley auth` sends it for you.

# --- Every authenticated client --------------------------------------------
# Read the whole Volley tree (dashboards, coordinators and agents all observe).
# This includes a Claude sign-in's URL on volley/_system/claude/<acct>/signin while
# it runs (SPEC §4.6.11); to keep it from agents, generate this file without the
# global read and grant volley/_system/claude/# to the owner's identities only.
pattern read volley/#
# Lease requests are the one user-space write under a reserved prefix (SPEC §2.4, §4.6.5).
pattern write volley/_system/leases/+/requests

# --- Per-agent identities (username = agent id) ----------------------------
# An agent publishes only on its own channels and its own registry entry. It
# cannot write another agent's mailbox (no steering injection between agents),
# the `_waves/*` topics SPEC defines, or the retained `_waves/_config`.
# Acks (SPEC §4.4) go to the SENDER's mailbox, so `volley auth add-agent <id>
# --ack-to <sender>` appends a managed `user <id>` block at the END of this
# file granting exactly `volley/+/<sender>/mailbox`. `volley auth add <name>
# --role <role>` appends a `# >>> volley account` block per account (its role's
# template) and `volley auth token` a `# >>> volley token` block per one-time
# token login. Keep your own edits above all managed blocks: a `topic` line
# below a `user` line belongs to that user.
pattern write volley/+/%u/status
pattern write volley/+/%u/progress
pattern write volley/+/%u/result
pattern write volley/+/%u/capability
pattern write volley/+/%u/control
pattern write volley/+/%u/_user/#
pattern write volley/_system/registry/%u

# --- Fixed identities --------------------------------------------------------
# The supervisor daemon: full read/write, including `_waves/*`, the retained
# `_waves/_config` (config_set requests reach it through its own mailbox) and
# the per-agent screen channel it publishes on the agent's behalf. It also reads
# one-time token redemptions and answers them under `volley-auth/` (SPEC §4.6.10).
user volleyd
topic readwrite volley/#
topic readwrite volley-auth/#

# Browser clients (volley dash, the Desk): observe everything; steer agents and
# send control requests (including config_set) to the daemon's mailbox.
user desk
topic write volley/+/+/mailbox

# Coordinator sessions: an OPERATOR-LEVEL identity. Steers like the Desk and
# also runs its own Volley MCP server, whose agent id is random-suffixed
# (`coordinator-ab12`), so it cannot be pinned with `%u`: it may write the
# standard agent channels and registry entry of ANY agent id, i.e. it can forge
# another agent's status. Agents dispatched without a minted identity (the
# legacy /volley-issues path) inherit this identity from the MCP server env.
# Still none of the defined `_waves/*` topics and no `_waves/_config`.
user coordinator
topic write volley/+/+/mailbox
topic write volley/+/+/status
topic write volley/+/+/progress
topic write volley/+/+/result
topic write volley/+/+/capability
topic write volley/+/+/control
topic write volley/+/+/_user/#
topic write volley/_system/registry/+
