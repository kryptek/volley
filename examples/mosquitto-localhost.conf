# mosquitto config for local Volley development.
#
# Localhost-bound + anonymous: safe because the listener never leaves this
# machine. Do NOT use this config for any deployment that exposes 1883 to
# a network — you'd need TLS + auth there. See the mosquitto docs:
#   https://mosquitto.org/man/mosquitto-conf-5.html
#   https://mosquitto.org/documentation/authentication-methods/
#
# Persistence is on so the Volley registry (retained `_system/registry/+`
# entries) and per-agent retained `status` topics survive `brew services
# restart mosquitto`. Without it, every broker restart wipes every agent's
# registry entry and `vol_list_agents` returns empty until agents re-register.
#
# Install path on macOS (Homebrew, Apple Silicon):
#   /opt/homebrew/etc/mosquitto/mosquitto.conf
# Install path on macOS (Homebrew, Intel):
#   /usr/local/etc/mosquitto/mosquitto.conf
# Install path on Linux (apt / yum / dnf):
#   /etc/mosquitto/mosquitto.conf
#
# Two listeners are configured below:
#   1. TCP on 1883 — used by the MCP server (volley-mcp), the CLI
#      (volley-cli), and any other native mqtt.js / paho client.
#   2. WebSocket on 9001 — used by the browser dashboard
#      (`packages/volley-dash`). Browsers cannot speak raw MQTT-over-TCP,
#      so the dashboard connects via `mqtt.connect("ws://localhost:9001")`
#      directly to mosquitto. Same allow_anonymous gate as TCP — both
#      listeners are 127.0.0.1-bound so traffic never leaves the machine.
#
# Copy this file over the default conf, then `brew services restart mosquitto`
# (macOS) or `sudo systemctl restart mosquitto` (Linux).

listener 1883 127.0.0.1
allow_anonymous true

listener 9001 127.0.0.1
protocol websockets

persistence true
persistence_location /opt/homebrew/var/mosquitto/

# Log to stderr so `brew services log mosquitto` captures it. Most log
# levels are on by default; explicitly turning these on makes the local-dev
# experience friendlier when you're debugging an agent that won't register.
log_dest stderr
log_type error
log_type warning
log_type notice
log_type information
