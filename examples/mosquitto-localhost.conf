# mosquitto config for local Volley development.
#
# Localhost-bound + authenticated. Localhost-only is NOT enough on its own:
# any local process can reach 1883, and any web page you visit can open a
# WebSocket to 127.0.0.1:9001 and steer your agents. So both listeners
# require a username/password and an ACL (see examples/mosquitto-auth/).
# Run `volley auth init` BEFORE installing this file — mosquitto refuses to
# start when password_file does not exist. Exposing the broker beyond this
# machine additionally needs TLS (mqtts:// / wss://). See the mosquitto docs:
#   https://mosquitto.org/man/mosquitto-conf-5.html
#   https://mosquitto.org/documentation/authentication-methods/
#
# Persistence is on so the Volley registry (retained `_system/registry/+`
# entries) and per-agent retained `status` topics survive `brew services
# restart mosquitto`. Without it, every broker restart wipes every agent's
# registry entry and `vol_list_agents` returns empty until agents re-register.
#
# Install path on macOS (Homebrew, Apple Silicon):
#   /opt/homebrew/etc/mosquitto/mosquitto.conf
# Install path on macOS (Homebrew, Intel):
#   /usr/local/etc/mosquitto/mosquitto.conf
# Install path on Linux (apt / yum / dnf):
#   /etc/mosquitto/mosquitto.conf
#
# Two listeners are configured below:
#   1. TCP on 1883 — used by the MCP server (volley-mcp), the CLI
#      (volley-cli), and any other native mqtt.js / paho client.
#   2. WebSocket on 9001 — used by the browser dashboard
#      (`packages/volley-dash`). Browsers cannot speak raw MQTT-over-TCP,
#      so the dashboard connects via `mqtt.connect("ws://localhost:9001")`
#      directly to mosquitto. Same auth + ACL as TCP (the settings below
#      are global, so they cover both listeners); both listeners are
#      127.0.0.1-bound so traffic never leaves the machine.
#
# Copy this file over the default conf, then `brew services restart mosquitto`
# (macOS) or `sudo systemctl restart mosquitto` (Linux).

# --- Authentication + ACL (volley auth init writes both files and prints
# these lines with your paths; Intel Homebrew: /usr/local/etc/mosquitto/volley,
# Linux: /etc/mosquitto/volley, created with `sudo ... auth init` so the files
# end up owned by the mosquitto user the broker drops to) ---
allow_anonymous false
password_file /opt/homebrew/etc/mosquitto/volley/passwd
acl_file /opt/homebrew/etc/mosquitto/volley/acl.conf

listener 1883 127.0.0.1

listener 9001 127.0.0.1
protocol websockets

persistence true
persistence_location /opt/homebrew/var/mosquitto/

# Persistence also holds the QoS 1 mailbox messages queued for offline agents
# with a persistent session (SPEC §4.4). mosquitto only writes its persistence
# DB every `autosave_interval` seconds (default 1800), so a broker crash can
# lose up to 30 minutes of queued messages. Save every 30 s instead
# (`autosave_on_changes false` makes the interval a time, not a change count).
# volleyd's own journal stays the source of truth either way; this narrows the
# window in which the broker's copy lags behind it.
autosave_interval 30
autosave_on_changes false

# Log to stderr so `brew services log mosquitto` captures it. Most log
# levels are on by default; explicitly turning these on makes the local-dev
# experience friendlier when you're debugging an agent that won't register.
log_dest stderr
log_type error
log_type warning
log_type notice
log_type information
