# Auth-enabled mosquitto for test/integration/mosquitto-auth.test.ts.
#
# CI (.github/workflows/ci.yml, test-integration-auth) mounts the repo and
# runs auth-fixture.sh inside the eclipse-mosquitto container first, which
# writes /tmp/volley-auth/{passwd,acl.conf}. The ACL is the shipped
# examples/mosquitto-auth/acl.conf, so CI asserts what users install.
#
# Locally, against a PRIVATE broker (never the one your agents use):
#   d=$(mktemp -d); P=21884
#   sh test/integration/auth-fixture.sh "$d" ../../examples/mosquitto-auth/acl.conf
#   sed -e "s#/tmp/volley-auth#$d#" -e "s#^listener 1884#listener $P 127.0.0.1#" \
#     test/integration/mosquitto-auth.conf > "$d/mosquitto.conf"
#   mosquitto -c "$d/mosquitto.conf" -d
#   VOLLEY_AUTH_BROKER_URL=mqtt://127.0.0.1:$P bun run test:integration

listener 1884
allow_anonymous false
password_file /tmp/volley-auth/passwd
acl_file /tmp/volley-auth/acl.conf
