# volleyd config: copy to $VOLLEYD_HOME/config.yaml (default ~/.volley/volleyd/config.yaml).
# Every key is optional and layers over the built-in defaults (src/config-defaults.ts); a wave
# file's `config:` block layers over this. All of it is hot-reloadable: change it with
# `volleyd config set <path> <value>` (validated, journaled, applied without a restart) rather
# than by editing this file while the daemon runs. Bounds: spec/schemas/config.schema.json.

# hard_ceiling: 12              # max live supervised agents across all waves (runaway fuse)
# spawn_budget_multiplier: 3    # raises the derived spawn budget to multiplier x task count

# Heavy-operation lease pools. A command matching a pool's `match` regex (checked by the
# volley-hooks PreToolUse lease hook, matched against each command the shell would execute, not
# comments, heredocs or message text) runs inside `volley lease run --pool <pool> -- ...` and
# waits for one of `capacity` leases. Lowering a capacity never preempts a holder; removing a
# pool keeps its holders and rejects new requests.
# lease_pools:
#   backend-it:
#     capacity: 3
#     ttl_s: 3600               # lease expiry unless renewed (default 3600)
#     match: ["mvn .*verify", "mvn .*test", "gradle .*integrationTest"]
#     per_machine_overrides: { local: 1 }  # per machine name (local: the supervisor's own),
#                                # the cap there in place of per_machine (0..capacity)
#   build:
#     capacity: 2
#     match: ["npm run build", "vite build"]
#   browser:
#     capacity: 2
#     match: ["playwright"]

# Load-aware spawn admission: a signal above its max holds new starts (never running work)
# until it has been clear for `hysteresis_samples` consecutive samples (one sample per tick).
# admission:
#   memory_pressure_max_level: 2   # macOS level: 1 normal, 2 warn, 4 critical
#   cmux_ping_max_ms: 2000         # `cmux ping` wall time
#   container_max: 20              # running containers (`docker info`)
#   api_overload_window_s: 300     # window for provider overload / rate-limit signals
#   api_overload_max: 3            #   ... and how many of them are tolerated in it
#   ci_queue_max: 10               # queued workflow runs of the wave's repo (`gh api`)
#   hysteresis_samples: 3

# heartbeat_alarm_s: 600        # no heartbeat this long while working -> screen check
# idle_grace_s: 180             # turn ended without a terminal status -> one steer, then a decision
# background_wait_max_s: 7200   # an idle agent showing its own work (background task, lease, shells, writes) is left alone this long
# stall_backoff_max_s: 1800     # cap on the doubling gap between agent_stalled decisions
# blocked_undecided_stall_ms: 300000  # a blocked agent no decision names this long -> agent_stalled
# tool_in_flight_max_s: 7200    # a tool call in flight (PreToolUse, no PostToolUse yet) is not silence this long
# mailbox_wake_after_ms: 20000  # no ack of a mailbox steer this long: wake an idle agent
# fallback_model: null
# mailbox: { session_expiry_s: 604800 }
# worktree_root: ~/.volley/worktrees  # default $VOLLEYD_HOME/worktrees when VOLLEYD_HOME is set
# spawn_timeout_s: 120
# spawn_retry_max_s: 900        # cap on a failed spawn's retry delay (30 s, doubling)
# spawn_retry_max: 8            # failed attempts in a row before retries stop (decision says so)
# brief_preface_max_bytes: 16384  # largest brief preface; a larger one refuses run / the spawn
# wake_grace_s: 120
# screen_tail_interval_s: 5     # seconds between captures of each live agent's terminal (screen topic)
# tmux_cols: 220                # a paired machine's tmux session size at launch (and after the
# tmux_rows: 50                 # Desk's Terminal popout closes); 20..500 each
# stop_grace_s: 30              # after `volleyd stop`: seconds agents get to end; then force-retired
# dynsec_batch_ms: 50           # window collecting simultaneous mints / deletes into ONE broker
#                               # control message (one Dynamic Security state-file rewrite)
# credential_sweep_interval_s: 600  # seconds between sweeps deleting logins of agents no longer live

# Claude account profiles (README "Claude accounts"): the account an agent runs under when its
# task and wave name none — an id from `volley claude list`, primary (your own ~/.claude), or
# most_headroom (the signed-in account with the lowest 5-hour usage; the primary without usage
# data). null: primary. warn_at_pct: the 5-hour usage at which each wave on that account gets an
# account_limit decision (README "Usage metering"); nothing moves unless you answer it.
# claude:
#   default_account: null
#   warn_at_pct: 90

# How the pipeline's rebase step updates a PR branch when the release branch moved (README
# "Rebase rule"): rebase (rebase + a lease-guarded force-push) or merge (merge it in + a normal
# push; for repositories that allow no force-push of any kind).
# branch_update: rebase

# The MCP servers a launched agent loads (README "MCP wiring"): strict (only the `volley` server
# volleyd gives it, a reproducible and minimal agent) or inherit (your own servers too, such as
# plugin servers and connectors).
# agent_mcp: strict

# Under agent_mcp: inherit, the only user servers an agent starts, by name (README "MCP wiring"):
# volleyd copies them from the profile's .claude.json and the repository's .mcp.json into the
# agent's mcp.json and launches it strict. [] (the default): every server.
# agent_mcp_allow: []

# The share of an agent's context window at which Claude Code compacts its conversation (README
# "Auto-compaction"): 85 compacts where the Desk's meter turns red; 0 leaves Claude Code's default.
# agent_auto_compact_pct: 85

# What the reviewers flag as public hygiene (person names, local usernames, machine paths,
# private hostnames or IPs): auto (read the repository's visibility once per wave version: P1
# for a public repository or one whose visibility cannot be read, a non-blocking P3 for a
# private or internal one), on (always P1) or off (no hygiene check).
# public_hygiene: auto

# Remote hosts a wave task may name with `host: <name>`: its agents run in tmux on that machine
# over ssh and reach the broker through a reverse tunnel. Paths are on the remote machine and
# must be absolute. See README "Remote hosts (ssh + tmux)".
# hosts:
#   buildbox:
#     target: me@buildbox          # ssh destination ([user@]host or an ssh config alias)
#     repo: /path/to/repo          # deprecated (repos: below): the wave repo's clone there;
#                                  # migrated to repos once the machine reports its origin
#     repos: { example-org/gadgets: /path/to/gadgets }  # adopted clones there, by GitHub
#                                  # owner/name (absolute paths)
#     volley_dir: /path/to/volley
#     worktree_root: /path/to/worktrees  # default: .volley-worktrees beside repo
#     tunnel:
#       remote_port: 21883         # remote 127.0.0.1 port that reaches the broker
#       supervise: true            # volleyd keeps `ssh -N -R` up itself
#     max_agents: 4                # supervised agents it runs at once (1..100); hard_ceiling caps the total
#     drain: false                 # true: no new placements there; its running agents finish

# Repositories by GitHub owner/name and the machines holding a clone of each (all, or a list of
# machine names). A listed machine's clone is its hosts.<name>.repos entry, else the managed
# clone at <fleet.repo_root>/<owner>/<name>. A wave file's repo: may name one. See README
# "Repositories".
# repos: {}                      # e.g. { example-org/widgets: { machines: all } }

# --- Fleet: fresh base + merge nudge (README "Base ref", "The pipeline and the merge-ready gate") ---
# require_fresh_base: true       # a failed `git fetch origin <release>` refuses the spawn (BASE_STALE,
#                                # retried with the usual backoff); false: cut from the host's last
#                                # copy and journal a BASE_STALE warning
# retire_close_session: true     # a retire also ends the agent's session: closes its workspace and
#                                # stops its claude process (agent_session_closed); false: finished
#                                # sessions stay open for inspection (README "Retire and cleanup")
# placement:
#   nudge_on_merge: files        # when a wave's PR merges, steer its running implementers once:
#                                # files (their task's files hints overlap the PR's), all, or off

# --- Fleet: the supervisor's own machine (README "Fleet: readiness, the supervisor's card, Repair") ---
# fleet:
#   local_name: null             # its machine record's name; null: the host name's first label,
#                                # lowercased. Never a hosts.<name> key.
#   local_agents: null           # how it takes auto-placed tasks: always (a candidate like any
#                                # peer), fallback (only while no paired machine is eligible, under
#                                # fallback: below), never; null: fallback once any hosts.<name> is
#                                # configured, else always
#   fallback:                    # its profile while it is the fallback
#     max_agents: 3              # agents on it at most (hard_ceiling still caps the total)
#     per_machine: {}            # per heavy pool, its slots, e.g. { js-suite: 1, backend-it: 0 };
#                                # a pool not named gets 1 when it sets per_machine
#   repo_root: ~/.volley/repos   # managed clones at <repo_root>/<owner>/<name> on every machine
#                                # (~: that machine's home)

# --- Autopilot: decisions volleyd answers itself, and merging (README "Autopilot") ---
# autopilot:
#   enabled: true                # false: every decision waits for the owner (next decision on)
#   owner_only: [plan_change, repo_untrusted, model_switch, release_go, stage_go]
#                                # kinds only the owner answers: always escalated
#   relaunch_max: 1              # relaunches of one <task>/<role> after a bad launch
#   nudge_max: 1                 # extra nudges of one stalled run (<task>/<role>/<attempt>)
#   respawn_max: 1               # respawns of one <task>/<role>
#   rereview_max: 2              # re-reviews of one task (moved head, stale review at the gate)
#   ci_fixup_max: 2              # CI fixups of one task (CI red on its own change)
#   question_max: 1              # agent questions answered for one run
#   budget_raise_max: 2          # raise by <n> answers may take the spawn budget to this
#                                # multiple of the wave's derived budget
#   inbox_answered_ttl_s: 600    # an answered needs-you inbox item stays retained this long
#   merge: auto                  # who merges a gated PR when the wave file has no merge: key:
#                                # auto (volleyd squash-merges exactly the gated head, behind the
#                                # fence; merged_by_supervisor) or manual (a human merges)
#   merge_retry_max: 2           # merges GitHub may refuse at one gated head before volleyd asks
#                                # (decision merge_refused: retry, manual or cancel)
#   delete_branch: false         # autopilot merges also delete the PR's head branch
#   reconnect_grace_s: 900       # a wave owned by a coordinator name whose session went away reads
#                                # coordinator.state "reconnecting" this long (60..86400), then "gone"

# --- Archiving (README "Archiving") ---
# archive_ended_after_h: 24      # archive a stopped / complete wave this many hours after it ended; 0: never
# archive_on_ack: true           # archive a complete wave as soon as its wave_complete decision is answered

# --- CI reads (README "CI verification") ---
# ci_rate_limit_backoff_ms: 300000  # after GitHub rate-limits a CI read (HTTP 403 / 429), no CI call for the wave for this long (or a Retry-After in gh's output, if longer)

# --- The coordinator role (README "The coordinator role", SPEC §4.6.25) ---
# coordinator:
#   machine: null                # where volleyd keeps the owner's claude remote-control server
#                                # alive: local, a paired machine's hosts.<name>, or null (off)
#   dir: ~/.volley/coordinator   # its directory there (~: that machine's home)
#   capacity: 4                  # the server's --capacity (concurrent sessions)
#   permission_mode: acceptEdits # --permission-mode for the sessions it spawns
#   restart_backoff_s: [5, 30, 120]  # waits before each restart; three quick deaths: failed
#   allow_laptop: false          # a machine whose record says laptop: true may host it
