# Plan v1 of a wave whose plan changes mid-flight (v2.yaml is the next version).
wave: w-plan
repo: ~/repos/example
release_branch: release/w-plan
model: claude-opus-5-5
pipeline: [implement, [spec_review, quality_review], merge_ready]
tasks:
  T1: { issue: 101 }
  T2: { issue: 102, after: [T1] }
  T3: { issue: 103 }
  T4: { issue: 104, after: [T1] }
  T5: { issue: 105 }
