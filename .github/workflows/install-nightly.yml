name: Install (nightly)

# Layers 2–4 of the one-command install's tests (scripts/install-tests/README.md), nightly on the
# owner's machines as self-hosted runners: fresh Ubuntu 24.04 and Debian 13 VMs with systemd
# through multipass (Layer 2: real services, a reboot), fresh macOS VMs through Tart (Layer 3: both
# install paths, launchd, the keychain, the Desk), and a hub VM pairing a peer VM (Layer 4:
# `volley machine add`, readiness, a task placed on the peer, removal). Each job's metrics table
# lands in its step summary; a failing job opens or comments on the one issue labelled
# `install-tests`, and the `report` job does too when a job failed or never ran (no runner online,
# a preflight that stopped before the run's own reporting).
#
# Never on pull_request: a public repository must not run a PR's code on self-hosted runners. The
# schedule runs the default branch; a dispatch runs the branch it names (and, with `version`,
# that release instead of the checkout).

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Install this release tag (vX.Y.Z) instead of the checkout"
        required: false
        default: ""

permissions:
  contents: read
  # The tracking issue (lib.sh's track_failure).
  issues: write

concurrency:
  group: install-nightly
  cancel-in-progress: false

env:
  VERSION_INPUT: ${{ inputs.version }}
  VM_TRACK_ISSUE: "1"

jobs:
  linux-vm:
    name: Layer 2 (${{ matrix.distro }})
    if: github.repository == 'kryptek/volley'
    runs-on: [self-hosted, volley-linux-vm]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One Linux box: one VM run at a time.
      max-parallel: 1
      matrix:
        distro: [ubuntu-24.04, debian-13]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: A fresh VM, install, set up, reboot, check
        env:
          VM_OUT: ${{ runner.temp }}/layer2-${{ matrix.distro }}
          # The tracking issue (lib.sh's track_failure): this step only, not the actions'.
          GH_TOKEN: ${{ github.token }}
          DISTRO: ${{ matrix.distro }}
        run: |
          args=()
          if [ -n "$VERSION_INPUT" ]; then
            [[ $VERSION_INPUT =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be vX.Y.Z" >&2; exit 2; }
            args=(--version "$VERSION_INPUT")
          fi
          bash scripts/install-tests/run-layer2.sh "$DISTRO" ${args[@]+"${args[@]}"}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer2-${{ matrix.distro }}
          # The raw transcript (unredacted) and the run's key (a killed run leaves it) never leave
          # the machine.
          path: |
            ${{ runner.temp }}/layer2-${{ matrix.distro }}
            !${{ runner.temp }}/layer2-${{ matrix.distro }}/transcript.raw
            !${{ runner.temp }}/layer2-${{ matrix.distro }}/**/key
          if-no-files-found: ignore
          retention-days: 14

  macos-tart:
    name: Layer 3 (macos-${{ matrix.path }})
    if: github.repository == 'kryptek/volley'
    runs-on: [self-hosted, volley-macos-tart]
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # One Mac: one VM run at a time.
      max-parallel: 1
      matrix:
        path: [curl, brew]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: A fresh macOS VM, install, set up, restart, check
        env:
          VM_OUT: ${{ runner.temp }}/layer3-${{ matrix.path }}
          # The tracking issue (lib.sh's track_failure): this step only, not the actions'.
          GH_TOKEN: ${{ github.token }}
          INSTALL_PATH: ${{ matrix.path }}
        run: |
          args=()
          if [ -n "$VERSION_INPUT" ]; then
            [[ $VERSION_INPUT =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be vX.Y.Z" >&2; exit 2; }
            args=(--version "$VERSION_INPUT")
          fi
          bash scripts/install-tests/run-layer3.sh "$INSTALL_PATH" ${args[@]+"${args[@]}"}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer3-${{ matrix.path }}
          # The raw transcript (unredacted) and the run's key (a killed run leaves it) never leave
          # the machine.
          path: |
            ${{ runner.temp }}/layer3-${{ matrix.path }}
            !${{ runner.temp }}/layer3-${{ matrix.path }}/transcript.raw
            !${{ runner.temp }}/layer3-${{ matrix.path }}/**/key
          if-no-files-found: ignore
          retention-days: 14

  pair:
    name: Layer 4 (pair)
    if: github.repository == 'kryptek/volley'
    runs-on: [self-hosted, volley-linux-vm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: A hub VM, a peer VM, pair, place a task, remove
        env:
          VM_OUT: ${{ runner.temp }}/layer4
          # The tracking issue (lib.sh's track_failure): this step only, not the actions'.
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ -n "$VERSION_INPUT" ]; then
            [[ $VERSION_INPUT =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be vX.Y.Z" >&2; exit 2; }
            args=(--version "$VERSION_INPUT")
          fi
          bash scripts/install-tests/run-layer4.sh ${args[@]+"${args[@]}"}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer4-pair
          # The raw transcript (unredacted) and the run's key (a killed run leaves it) never leave
          # the machine.
          path: |
            ${{ runner.temp }}/layer4
            !${{ runner.temp }}/layer4/transcript.raw
            !${{ runner.temp }}/layer4/**/key
          if-no-files-found: ignore
          retention-days: 14

  # A job that never started (no runner carries its labels, a runner offline) or stopped before
  # lib.sh's track_failure reports nowhere by itself: this one does, on a hosted runner. Same label
  # and title as lib.sh's, so the two share the one issue (a scripted failure gets both comments).
  report:
    name: Report
    if: always() && github.repository == 'kryptek/volley'
    needs: [linux-vm, macos-tart, pair]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail, and tell the tracking issue, unless every job passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LINUX_VM: ${{ needs.linux-vm.result }}
          MACOS_TART: ${{ needs.macos-tart.result }}
          PAIR: ${{ needs.pair.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$LINUX_VM" = success ] && [ "$MACOS_TART" = success ] && [ "$PAIR" = success ]; then
            echo "Every job passed."
            exit 0
          fi
          body=$(printf '### The nightly did not pass\n\n%s\n\n| job | result |\n| --- | --- |\n| linux-vm (Layer 2) | %s |\n| macos-tart (Layer 3) | %s |\n| pair (Layer 4) | %s |\n\nA job that is `cancelled` or `failure` with no log of its own likely never found a runner (scripts/install-tests/README.md: the runners).\n' \
            "$RUN_URL" "$LINUX_VM" "$MACOS_TART" "$PAIR")
          printf '%s\n' "$body" >>"$GITHUB_STEP_SUMMARY"
          label=install-tests
          gh label create "$label" --color B60205 \
            --description "A nightly install test (Layers 2-4) failed" --force >/dev/null 2>&1 || true
          number=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            url=$(gh issue create --label "$label" --title "Nightly install tests are failing" \
              --body "The nightly install tests (scripts/install-tests/README.md, Layers 2-4) failed. Each failing run comments below; close this once a nightly passes.")
            number=${url##*/}
          fi
          gh issue comment "$number" --body "$body" || echo "WARN: could not comment on the tracking issue" >&2
          exit 1
