# Throwaway broker for the Dynamic Security benchmark (bench/dynsec/README.md).
#
# This is a TEMPLATE: run-local.sh and run-2.1.sh replace every @NAME@ placeholder
# and write the result into a temporary directory. Never point it at the ports a real
# Volley broker uses (1883, 9001).
#
# The plugin is global, so it is configured BEFORE any listener. With
# per_listener_settings false (the default, and what Volley's reference config uses)
# both listeners authenticate and authorise through it. The runners also start a second
# broker with per_listener_settings true to record what happens then (README row h).

per_listener_settings @PER_LISTENER_SETTINGS@
allow_anonymous false

# Disable Nagle on client sockets. mosquitto's default is false; with it, every control
# request/response round trip measured about 41 ms on Linux (README, "Latency"). The runners
# substitute true unless BENCH_NODELAY=false.
set_tcp_nodelay @NODELAY@

# The Dynamic Security plugin and the JSON file it owns. The file is created by
# `mosquitto_ctrl dynsec init <file> <admin-user> <admin-password>` before the first start;
# the plugin rewrites it after every change made over $CONTROL/dynamic-security/v1.
plugin @PLUGIN@
plugin_opt_config_file @DYNSEC_JSON@

# MQTT over TCP (agents, volleyd) and over WebSocket (the Desk).
listener @PORT@ @BIND@
listener @WS_PORT@ @BIND@
protocol websockets

# No retained-message or session persistence: the benchmark measures the plugin's own file.
persistence false
log_dest file @LOG_FILE@
log_type error
log_type warning
log_type notice
log_type information
